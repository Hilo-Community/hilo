[package]
name = "hilo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hilo Tauri v2 Desktop Shell assembling Host Core, Context Engine, Judge Orchestrator and Sandbox Runner"

[lints]
workspace = true

[lib]
name = "hilo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Hilo"
path = "src/main.rs"

[dependencies]
blake3.workspace = true
fs2 = "0.4.3"
tauri = { version = "2.10.2", features = [] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-opener = "=2.7.3"
agent-registry.workspace = true
agent-gateway.workspace = true
model-gateway.workspace = true
zeroize = "=1.9.1"
host-core.workspace = true
context-engine.workspace = true
judge-orchestrator.workspace = true
sandbox-runner.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tauri-plugin-notification = "=2.4.0"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dev-dependencies]
tempfile.workspace = true
